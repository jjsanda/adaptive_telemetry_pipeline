# Full local stack for adaptive_telemetry_pipeline.
#
#   make up      # build + start everything
#   make demo    # drive traffic, induce an anomaly, show the LLM triage log
#   make down    # tear down
#
# Tuned to run on a laptop: every service has a memory limit (~2 GiB total).
# Grafana runs with anonymous admin for a friction-free local demo — keep port
# 3000 bound to localhost.
name: adaptive-telemetry-pipeline

x-mem: &mem
  restart: unless-stopped

services:
  # ---------------- Collector ----------------
  # The custom adaptive-otelcol distribution (built with ocb) carrying all four
  # original components. To compare against the stock collector, swap `build`
  # for `image: otel/opentelemetry-collector-contrib:0.155.0` and mount
  # ./collector-contrib.yaml instead (that is the Phase 0 baseline).
  collector:
    <<: *mem
    build:
      context: ../..
      dockerfile: collector/Dockerfile
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ../../collector/config/collector.yaml:/etc/otel/collector.yaml:ro
    environment:
      ADAPTIVE_LLM_BACKEND: ${ADAPTIVE_LLM_BACKEND:-deterministic}
      ADAPTIVE_LLM_MODEL: ${ADAPTIVE_LLM_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADAPTIVE_TRIAGE_WEBHOOK_URL: ${ADAPTIVE_TRIAGE_WEBHOOK_URL:-}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (pipeline metrics)
      - "13133:13133" # health_check
    mem_limit: 320m
    depends_on: [jaeger, prometheus, loki]

  # ---------------- Backends ----------------
  jaeger:
    <<: *mem
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    mem_limit: 400m

  prometheus:
    <<: *mem
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    mem_limit: 300m

  loki:
    <<: *mem
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    mem_limit: 300m

  grafana:
    <<: *mem
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    mem_limit: 256m
    depends_on: [prometheus, jaeger, loki]

  # ---------------- Application (polyglot order pipeline) ----------------
  order-api:
    <<: *mem
    build: { context: ../../services, dockerfile: order-api/Dockerfile }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      DEPLOYMENT_ENVIRONMENT: local
      WORKER_URL: http://fulfillment-worker:8081/fulfill
    ports:
      - "8080:8080"
    mem_limit: 128m
    depends_on: [collector, fulfillment-worker]

  fulfillment-worker:
    <<: *mem
    build: { context: ../../services, dockerfile: fulfillment-worker/Dockerfile }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      DEPLOYMENT_ENVIRONMENT: local
      INVENTORY_URL: http://inventory:8082/check
      PRICING_URL: http://pricing:8083/price
    mem_limit: 128m
    depends_on: [collector, inventory, pricing]

  inventory:
    <<: *mem
    build: { context: ../../services/inventory }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: inventory
      PORT: "8082"
    mem_limit: 192m
    depends_on: [collector]

  pricing:
    <<: *mem
    build: { context: ../../services/pricing }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: pricing
      PORT: "8083"
    mem_limit: 256m
    depends_on: [collector]

  # ---------------- Load generator (opt-in: `make load`) ----------------
  loadgen:
    image: curlimages/curl:8.11.1
    profiles: [load]
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do curl -s http://order-api:8080/ >/dev/null 2>&1; sleep 0.3; done"]
    mem_limit: 32m
    depends_on: [order-api]
