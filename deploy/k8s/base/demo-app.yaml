# Demo workload — the Python `pricing` service, the demo's primary anomaly
# source (it slows down when chaos baggage targets it).
#
# The `inject-python: "true"` annotation opts the pod into SDK auto-injection
# from the single Instrumentation CR (`demo-instr`) in this namespace.
#
# NOTE: this image already bootstraps its own OTel SDK (services/pricing/app/
# otel.py) and is idempotent, so the injection here mainly demonstrates the
# mechanism; the injected OTEL_EXPORTER_OTLP_ENDPOINT still points telemetry at
# the gateway. For a pristine injection demo, use an un-instrumented image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: apps
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/part-of: adaptive-telemetry-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: pricing
          image: adaptive-pricing:latest
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: OTEL_SERVICE_NAME
              value: pricing
            - name: PORT
              value: "8083"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pricing
  namespace: apps
  labels:
    app.kubernetes.io/name: pricing
spec:
  selector:
    app.kubernetes.io/name: pricing
  ports:
    - name: http
      port: 8083
      targetPort: http
