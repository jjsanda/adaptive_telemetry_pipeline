apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-scoped + multi-namespace resources, so we deliberately do NOT set a
# top-level `namespace:` (that would rewrite everything into one namespace).
# Each resource pins its own metadata.namespace.
resources:
  - namespaces.yaml
  - rbac.yaml
  - gateway-collector.yaml
  - agent-collector.yaml
  - instrumentation.yaml
  - demo-app.yaml

# Extends the `images:` transformer to reach OpenTelemetryCollector.spec.image
# (see kustomizeconfig/images.yaml) so overlays can retag the distro image.
configurations:
  - kustomizeconfig/images.yaml
