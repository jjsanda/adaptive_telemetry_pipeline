# adaptive-otelcol pipeline configuration — the full adaptive loop.
#
#   traces  ──► redmetrics (RED) ──► metrics ──► anomaly (EWMA) ──► filter ──► llmtriage ──► logs
#
# resourcecost enriches every signal with owner/cost attributes along the way.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    send_batch_size: 512
    timeout: 5s

  # YOURS: FinOps/governance enrichment across all three signals.
  resourcecost:
    cost_per_kb: 0.0004
    default_team: platform
    team_by_service:
      order-api: payments-team
      fulfillment-worker: fulfillment-team
      inventory: fulfillment-team
      pricing: pricing-team

  # YOURS: streaming EWMA anomaly detection on metric data points.
  # warmup counts SAMPLES per series; with redmetrics flushing every 5s below,
  # warmup: 8 means ~40s before a series can be flagged (tuned for a live demo —
  # a production deployment would use a larger warmup).
  anomaly:
    alpha: 0.05
    threshold: 3.0
    warmup: 8
    stale_after: 5m
    sweep_interval: 1m

  # Keep only anomaly-flagged data points for the triage branch.
  filter/anomalies:
    error_mode: ignore
    metrics:
      datapoint:
        - 'attributes["anomaly.is_anomaly"] != true'

connectors:
  # YOURS: traces -> RED metrics.
  redmetrics:
    dimensions: [service.name, span.kind, http.route, status.code]
    histogram_buckets_ms: [5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000]
    flush_interval: 5s

  # YOURS: anomalous metrics -> async LLM triage -> correlated log records.
  llmtriage:
    backend: ${env:ADAPTIVE_LLM_BACKEND:-deterministic}
    model: ${env:ADAPTIVE_LLM_MODEL:-claude-sonnet-5}
    api_key: ${env:ANTHROPIC_API_KEY:-}
    webhook_url: ${env:ADAPTIVE_TRIAGE_WEBHOOK_URL:-}
    max_batch: 10
    max_wait: 5s
    debounce_window: 60s

  # Fan a copy of the scored metrics stream into the triage branch.
  forward/anomalies: {}

exporters:
  debug:
    verbosity: normal
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcecost, batch]
      exporters: [otlp/jaeger, redmetrics]

    metrics:
      receivers: [otlp, redmetrics]
      processors: [memory_limiter, resourcecost, anomaly, batch]
      exporters: [prometheus, forward/anomalies]

    metrics/triage:
      receivers: [forward/anomalies]
      processors: [filter/anomalies]
      exporters: [llmtriage]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcecost, batch]
      exporters: [otlphttp/loki]

    logs/triage:
      receivers: [llmtriage]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
